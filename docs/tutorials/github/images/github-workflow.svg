<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <rect x="0" y="0" width="800" height="420" rx="16" fill="#f5f3ee"/>
  <text x="400" y="46" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="22" fill="#1c2b39" font-weight="600">Local Repository → GitHub Remote</text>
  <rect x="60" y="120" width="230" height="160" rx="12" fill="#fbfaf7" stroke="#ddd8cd" stroke-width="2"/>
  <circle cx="85" cy="145" r="5" fill="#b9812c"/>
  <circle cx="102" cy="145" r="5" fill="#ddd8cd"/>
  <circle cx="119" cy="145" r="5" fill="#ddd8cd"/>
  <text x="80" y="185" font-size="14" fill="#1c2b39">$ git init</text>
  <text x="80" y="210" font-size="14" fill="#1c2b39">$ git add .</text>
  <text x="80" y="235" font-size="14" fill="#1c2b39">$ git commit -m</text>
  <text x="90" y="270" font-size="15" fill="#4a5a68" font-weight="600">Local Repository</text>
  <rect x="510" y="120" width="230" height="160" rx="12" fill="#fbfaf7" stroke="#2f6f6b" stroke-width="2"/>
  <path d="M545 165 h48 l10 12 h42 v50 h-100 z" fill="none" stroke="#2f6f6b" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="655" cy="182" r="6" fill="#2f6f6b"/>
  <circle cx="655" cy="208" r="6" fill="#2f6f6b"/>
  <path d="M655 188 v14" stroke="#2f6f6b" stroke-width="2.5"/>
  <text x="590" y="270" font-size="15" fill="#4a5a68" font-weight="600">GitHub Remote</text>
  <path d="M300 175 C 380 140, 420 140, 500 175" fill="none" stroke="#2f6f6b" stroke-width="3" marker-end="url(#arrowSignal)"/>
  <text x="358" y="128" font-size="14" fill="#2f6f6b" font-weight="600">git push</text>
  <path d="M500 235 C 420 270, 380 270, 300 235" fill="none" stroke="#b9812c" stroke-width="2.5" stroke-dasharray="5,5" marker-end="url(#arrowAmber)"/>
  <text x="362" y="288" font-size="13" fill="#b9812c" font-weight="600">git pull</text>
  <line x1="80" y1="345" x2="720" y2="345" stroke="#ddd8cd" stroke-width="2"/>
  <circle cx="140" cy="345" r="7" fill="#2f6f6b"/>
  <circle cx="300" cy="345" r="7" fill="#2f6f6b"/>
  <circle cx="460" cy="345" r="7" fill="#2f6f6b"/>
  <circle cx="620" cy="345" r="8" fill="#b9812c"/>
  <text x="120" y="368" font-size="11" fill="#4a5a68">init</text>
  <text x="266" y="368" font-size="11" fill="#4a5a68">readme</text>
  <text x="432" y="368" font-size="11" fill="#4a5a68">feature</text>
  <text x="598" y="368" font-size="11" fill="#b9812c" font-weight="600">HEAD</text>
  <defs>
    <marker id="arrowSignal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6f6b"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b9812c"/>
    </marker>
  </defs>
</svg>
